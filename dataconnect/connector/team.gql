# Team Operations

# Query all teams for an organization
query ListTeams($organizationId: UUID!)
@auth(
  level: USER
  insecureReason: "Query filtered by organizationId which scopes access to user's organization"
) {
  teams(where: { organizationId: { eq: $organizationId } }) {
    id
    name
    description
    parentTeamId
    createdAt
    updatedAt
  }
}

# Query a single team by ID
query GetTeam($id: UUID!)
@auth(level: USER, insecureReason: "Query filtered by team ID which is organization-scoped") {
  team(id: $id) {
    id
    organizationId
    parentTeamId
    name
    description
    createdAt
    updatedAt
    parentTeam {
      id
      name
    }
  }
}

# Create a new team
mutation CreateTeam(
  $organizationId: UUID!
  $name: String!
  $description: String
  $parentTeamId: UUID
)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  team_insert(
    data: {
      organizationId: $organizationId
      name: $name
      description: $description
      parentTeamId: $parentTeamId
    }
  )
}

# Update a team
mutation UpdateTeam($id: UUID!, $name: String, $description: String, $parentTeamId: UUID)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  team_update(
    id: $id
    data: { name: $name, description: $description, parentTeamId: $parentTeamId }
  )
}

# Delete a team
mutation DeleteTeam($id: UUID!)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  team_delete(id: $id)
}

# Add a member to a team
mutation AddTeamMember($teamId: UUID!, $userId: UUID!, $role: String)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  teamMember_insert(data: { teamId: $teamId, userId: $userId, role: $role })
}

# Remove a member from a team
mutation RemoveTeamMember($id: UUID!)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  teamMember_delete(id: $id)
}

# Update team member role
mutation UpdateTeamMemberRole($id: UUID!, $role: String)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  teamMember_update(id: $id, data: { role: $role })
}
