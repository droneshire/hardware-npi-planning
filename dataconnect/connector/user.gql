# User Operations

# Query all users for an organization
query ListUsers($organizationId: UUID!)
@auth(
  level: USER
  insecureReason: "Query filtered by organizationId which scopes access to user's organization"
) {
  users(where: { organizationId: { eq: $organizationId } }) {
    id
    name
    email
    role
    createdAt
    updatedAt
  }
}

# Query a single user by ID
query GetUser($id: UUID!)
@auth(level: USER, insecureReason: "Query filtered by user ID which is organization-scoped") {
  user(id: $id) {
    id
    organizationId
    name
    email
    role
    firebaseUid
    createdAt
    updatedAt
  }
}

# Query user by email
query GetUserByEmail($email: String!)
@auth(
  level: USER
  insecureReason: "Query filtered by email - users can only access users in their organization"
) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
    organizationId
    name
    email
    role
    firebaseUid
    createdAt
    updatedAt
  }
}

# Query user by Firebase UID
query GetUserByFirebaseUid($firebaseUid: String!)
@auth(
  level: USER
  insecureReason: "Query filtered by Firebase UID - users can only access users in their organization"
) {
  users(where: { firebaseUid: { eq: $firebaseUid } }, limit: 1) {
    id
    organizationId
    name
    email
    role
    createdAt
    updatedAt
  }
}

# Create a new user
mutation CreateUser(
  $organizationId: UUID!
  $email: String!
  $name: String!
  $role: UserRole
  $firebaseUid: String!
)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer - only ADMIN users can create users"
) {
  user_insert(
    data: {
      organizationId: $organizationId
      email: $email
      name: $name
      role: $role
      firebaseUid: $firebaseUid
    }
  )
}

# Update a user
mutation UpdateUser($id: UUID!, $name: String, $role: UserRole)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  user_update(id: $id, data: { name: $name, role: $role })
}

# Delete a user
mutation DeleteUser($id: UUID!)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer - only ADMIN users can delete users"
) {
  user_delete(id: $id)
}
