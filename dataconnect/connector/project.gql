# Project Operations

# Query all projects for a program
query ListProjects($programId: UUID!)
@auth(level: USER, insecureReason: "Query filtered by programId which is organization-scoped") {
  projects(where: { programId: { eq: $programId } }) {
    id
    name
    description
    status
    startDate
    targetCompletionDate
    actualCompletionDate
    ownerId
    productTypeId
    createdAt
    updatedAt
    owner {
      id
      name
      email
    }
    productType {
      id
      name
    }
  }
}

# Query a single project by ID with full details
query GetProject($id: UUID!)
@auth(level: USER, insecureReason: "Query filtered by project ID which is organization-scoped") {
  project(id: $id) {
    id
    programId
    productTypeId
    name
    description
    status
    startDate
    targetCompletionDate
    actualCompletionDate
    ownerId
    createdAt
    updatedAt
    owner {
      id
      name
      email
      role
    }
    program {
      id
      name
      portfolioId
      portfolio {
        id
        name
        organizationId
      }
    }
    productType {
      id
      name
      description
    }
  }
}

# Query all projects by status
query ListProjectsByStatus($status: ProjectStatus!)
@auth(
  level: USER
  insecureReason: "Query filtered by status, authorization enforced at application layer"
) {
  projects(where: { status: { eq: $status } }) {
    id
    name
    description
    status
    startDate
    targetCompletionDate
    programId
    program {
      id
      name
      portfolio {
        id
        name
      }
    }
  }
}

# Create a new project
mutation CreateProject(
  $programId: UUID!
  $name: String!
  $description: String
  $status: ProjectStatus
  $startDate: Date
  $targetCompletionDate: Date
  $ownerId: UUID
  $productTypeId: UUID
)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  project_insert(
    data: {
      programId: $programId
      name: $name
      description: $description
      status: $status
      startDate: $startDate
      targetCompletionDate: $targetCompletionDate
      ownerId: $ownerId
      productTypeId: $productTypeId
    }
  )
}

# Update an existing project
mutation UpdateProject(
  $id: UUID!
  $name: String
  $description: String
  $status: ProjectStatus
  $startDate: Date
  $targetCompletionDate: Date
  $actualCompletionDate: Date
  $ownerId: UUID
  $productTypeId: UUID
)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  project_update(
    id: $id
    data: {
      name: $name
      description: $description
      status: $status
      startDate: $startDate
      targetCompletionDate: $targetCompletionDate
      actualCompletionDate: $actualCompletionDate
      ownerId: $ownerId
      productTypeId: $productTypeId
    }
  )
}

# Delete a project
mutation DeleteProject($id: UUID!)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  project_delete(id: $id)
}
