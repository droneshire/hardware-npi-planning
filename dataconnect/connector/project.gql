# Project Operations

# Query all projects for a program
query ListProjects($programId: UUID!) @auth(level: USER) {
  projects(where: { programId: { eq: $programId } }) {
    id
    name
    description
    status
    startDate
    targetCompletionDate
    actualCompletionDate
    ownerId
    productTypeId
    createdAt
    updatedAt
    owner {
      id
      name
      email
    }
    productType {
      id
      name
    }
  }
}

# Query a single project by ID with full details
query GetProject($id: UUID!) @auth(level: USER) {
  project(id: $id) {
    id
    programId
    productTypeId
    name
    description
    status
    startDate
    targetCompletionDate
    actualCompletionDate
    ownerId
    createdAt
    updatedAt
    owner {
      id
      name
      email
      role
    }
    program {
      id
      name
      portfolioId
      portfolio {
        id
        name
        organizationId
      }
    }
    productType {
      id
      name
      description
    }
    phases {
      id
      name
      description
      status
      startDate
      targetEndDate
      actualEndDate
      order
      percentComplete
      createdAt
      updatedAt
    }
    assignments {
      id
      userId
      allocationPercent
      startDate
      endDate
      notes
      createdAt
      updatedAt
      user {
        id
        name
        email
      }
    }
  }
}

# Query all projects by status
query ListProjectsByStatus($status: ProjectStatus!) @auth(level: USER) {
  projects(where: { status: { eq: $status } }) {
    id
    name
    description
    status
    startDate
    targetCompletionDate
    programId
    program {
      id
      name
      portfolio {
        id
        name
      }
    }
  }
}

# Create a new project
mutation CreateProject(
  $programId: UUID!
  $name: String!
  $description: String
  $status: ProjectStatus
  $startDate: Date
  $targetCompletionDate: Date
  $ownerId: UUID
  $productTypeId: UUID
) @auth(level: USER) {
  project_insert(
    data: {
      programId: $programId
      name: $name
      description: $description
      status: $status
      startDate: $startDate
      targetCompletionDate: $targetCompletionDate
      ownerId: $ownerId
      productTypeId: $productTypeId
    }
  )
}

# Update an existing project
mutation UpdateProject(
  $id: UUID!
  $name: String
  $description: String
  $status: ProjectStatus
  $startDate: Date
  $targetCompletionDate: Date
  $actualCompletionDate: Date
  $ownerId: UUID
  $productTypeId: UUID
) @auth(level: USER) {
  project_update(
    id: $id
    data: {
      name: $name
      description: $description
      status: $status
      startDate: $startDate
      targetCompletionDate: $targetCompletionDate
      actualCompletionDate: $actualCompletionDate
      ownerId: $ownerId
      productTypeId: $productTypeId
    }
  )
}

# Delete a project
mutation DeleteProject($id: UUID!) @auth(level: USER) {
  project_delete(id: $id)
}
