# Product Type Operations

# Query all product types for an organization
query ListProductTypes($organizationId: UUID!)
@auth(
  level: USER
  insecureReason: "Query filtered by organizationId which scopes access to user's organization"
) {
  productTypes(where: { organizationId: { eq: $organizationId } }) {
    id
    name
    description
    createdAt
    updatedAt
  }
}

# Query a single product type by ID
query GetProductType($id: UUID!)
@auth(
  level: USER
  insecureReason: "Query filtered by product type ID which is organization-scoped"
) {
  productType(id: $id) {
    id
    organizationId
    name
    description
    createdAt
    updatedAt
  }
}

# Create a new product type
mutation CreateProductType($organizationId: UUID!, $name: String!, $description: String)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  productType_insert(
    data: { organizationId: $organizationId, name: $name, description: $description }
  )
}

# Update a product type
mutation UpdateProductType($id: UUID!, $name: String, $description: String)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  productType_update(id: $id, data: { name: $name, description: $description })
}

# Delete a product type
mutation DeleteProductType($id: UUID!)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  productType_delete(id: $id)
}

# Link a phase template to a product type
mutation CreateProductTypePhaseConfig($productTypeId: UUID!, $phaseTemplateId: UUID!)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  productTypePhaseConfig_insert(
    data: { productTypeId: $productTypeId, phaseTemplateId: $phaseTemplateId }
  )
}

# Unlink a phase template from a product type
mutation DeleteProductTypePhaseConfig($id: UUID!)
@auth(
  level: USER
  insecureReason: "Authorization enforced at application layer based on user role and organization membership"
) {
  productTypePhaseConfig_delete(id: $id)
}
